<!DOCTYPE html>
<html lang="en">
<head>
<title>BG3 Character Generator</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&family=Alegreya+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main>
  <div class="toolbar">
    <button class="primary" id="generateAll">Generate character</button>
    <div class="save-controls">
      <div class="save-notice" id="saveNotice" role="status" aria-live="polite"></div>
      <button id="saveCharacter">Save build</button>
    </div>
  </div>

  <section class="saved-strip" id="savedStrip" aria-labelledby="savedHeading" hidden>
    <h2 class="saved-heading" id="savedHeading">Saved builds</h2>
    <ul class="saved-list" id="savedCharacters"></ul>
  </section>

  <section class="cards" id="cards" aria-live="polite"></section>

</main>

<script src="js/data.js" defer></script>
<script src="js/generator.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
