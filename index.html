<!DOCTYPE html>
<html lang="en">
<head>
<title>BG3 Character Generator</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&family=Alegreya+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>

<main>
  <div class="toolbar">
    <div class="toolbar-main">
      <button class="primary" id="generateAll">Generate character</button>
      <button id="settingsToggle" aria-expanded="false" aria-controls="settingsPanel">Settings</button>
    </div>
    <div class="save-controls">
      <div class="save-notice" id="saveNotice" role="status" aria-live="polite"></div>
      <button id="shareLink">Share link</button>
      <button id="copyText">Copy text</button>
      <button id="saveCharacter">Save build</button>
    </div>
  </div>

  <section class="settings-panel" id="settingsPanel" aria-label="Settings" hidden></section>

  <section class="copy-box" id="copyBox" aria-labelledby="copyHeading" hidden>
    <div class="copy-box-head">
      <h2 id="copyHeading">Copy this</h2>
      <button type="button" id="copyClose">Close</button>
    </div>
    <p class="settings-note">Your browser blocked automatic copying. The text below is selected, so press Ctrl+C (or long-press and copy on a phone).</p>
    <textarea id="copyField" readonly></textarea>
  </section>

  <section class="saved-strip" id="savedStrip" aria-labelledby="savedHeading" hidden>
    <h2 class="saved-heading" id="savedHeading">Saved builds</h2>
    <ul class="saved-list" id="savedCharacters"></ul>
  </section>

  <section class="cards" id="cards" aria-live="polite"></section>

  <footer class="site-footer">
    <p>Up to date with BG3 Patch 8</p>
    <p>Spotted something wrong? <a href="https://github.com/TheFallZ/BG3CharacterGenerator/issues">Report it on GitHub</a></p>
    <p>Unofficial fan project, not affiliated with Larian Studios</p>
  </footer>

</main>

<script src="js/data.js?v=8" defer></script>
<script src="js/generator.js?v=8" defer></script>
<script src="js/app.js?v=8" defer></script>
</body>
</html>
