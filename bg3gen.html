
<!DOCTYPE html>
<html lang="en">
<head>
<title>BG3 Character Generator</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main>
  <div class="toolbar">
    <div class="toolbar-group">
      <button class="primary" id="generateAll"><svg class="generate-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.7"/><circle cx="7" cy="7" r="1" fill="currentColor"/><circle cx="13" cy="13" r="1" fill="currentColor"/><circle cx="13" cy="7" r="1" fill="currentColor"/><circle cx="7" cy="13" r="1" fill="currentColor"/></svg>Generate character</button>
    </div>
    <div class="saved-builds">
      <div class="saved-build-actions">
        <button class="small" id="saveCharacter">Save</button>
        <button class="small" id="loadCharacter" disabled>Load</button>
        <button class="small" id="deleteCharacter" disabled>Delete</button>
      </div>
      <select id="savedCharacters" aria-label="Choose a saved result">
        <option value="">No saved results</option>
      </select>
      <div class="save-notice" id="saveNotice" role="status" aria-live="polite"></div>
    </div>
  </div>

  <section class="cards" id="cards" aria-live="polite"></section>

</main>

<script src="app.js" defer></script>
</body>
</html>
